<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Simon Portfolio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="basic.css">
    <link rel="stylesheet" href="dropdown.css">
    <link rel="icon" href="images/money-bag-icon.png" type="image/png">
</head>
<body>
    <header>
        <h1>Simon Portfolio</h1>
    </header>

    <div class="sidebar">
        <a class="active" href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#education">Education</a>
        <a href="#skills">Skills</a>
        <div class="sidebar-content">
            <!-- Your sidebar content here -->
        </div>
    </div>
        <main>
        <div class="container">
            <div class="slideshow-container">
                <div class="mySlides fade">
                    <div class="numbertext">1 / 3</div>
                    <img src="images/carousel/nightsky-shooting-star.jpg" style="max-width: 100%" alt="Night sky with shooting star">
                    <div class="text">Picture 1</div>
                </div>

                <div class="mySlides fade">
                    <div class="numbertext">2 / 3</div>
                    <img src="images/carousel/TS391237_large.jpg" style="max-width: 100%" alt="Night sky background">
                    <div class="text">Picture 2</div>
                </div>

                <div class="mySlides fade">
                    <div class="numbertext">2 / 3</div>
                    <img src="images/carousel/night-sky-background-tuvliumfllau73g1.webp" style="max-width: 100%" alt="Night sky with stars">
                    <div class="text">Picture 3</div>
                </div>

                <a class="prev" onclick="plusSlides(-1)" aria-label="Previous slide">&#10094;</a>
                <a class="next" onclick="plusSlides(1)" aria-label="Next slide">&#10095;</a>

                <div style="text-align: center;">
                    <span class="dot" onclick="currentSlide(1)" aria-label="Slide 1"></span>
                    <span class="dot" onclick="currentSlide(2)" aria-label="Slide 2"></span>
                    <span class="dot" onclick="currentSlide(3)" aria-label="Slide 3"></span>
                </div>
            </div>
        </div>
        <footer>
            <p>Copyright by Simon Larsson</p>
        </footer>
        </main>
    <script src="script.js"></script>
</body>
</html>
